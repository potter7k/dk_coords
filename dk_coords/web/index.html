
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <title>DK Development</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="display: none;">
        <div onclick="selectOption('sequential')" class="collectOption sequential">
            <h1>Sequencial</h1>
            <p>Colete uma sequência de coordenadas.</p>
        </div>
        <div onclick="selectOption('polyzone')" class="collectOption polyzone">
            <h1>PolyZone</h1>
            <p>Colete coordenadas de um PolyZone, com visualização em tempo real.</p>
        </div>
        <div onclick="selectOption('vehicles')" class="collectOption vehicles">
            <h1>Veículos</h1>
            <p>Colete uma sequencia de coordenadas para veículos.</p>
        </div>
        <div onclick="selectOption('racepoints')" class="collectOption racepoints">
            <h1>Racepoints</h1>
            <p>Colete uma sequência de coordenadas para criação de corridas, com prop de pneu.</p>
        </div>
    </div>
    <ul class="controls" style="display: none;">

    </ul>
    <div class="descriptionContainer" style="display: none;">
        <h1></h1>
        <p></p>
    </div>
    <div class="coordsOptions" style="display: none;">

    </div>
	<script src="script.js"></script>
</body>
</html>
